<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — Gughanathan Mani</title>
  <meta name="description" content="Python developer and DevOps engineer building AI assistants, FastAPI backends and cloud infrastructure." />
  <meta name="color-scheme" content="light dark" />
  <!-- Apply saved theme before first paint so there is no flash -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('gugupy-theme') || '{}')
        var mode = s.mode || 'system'
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.mode = dark ? 'dark' : 'light'
        if (s.accent) document.documentElement.dataset.accent = s.accent
      } catch (e) {}
    })()
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./static/styles.css" />
</head>
<body data-page="project">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- NAVBAR -->
  <header id="navbar">
    <nav class="nav-inner" aria-label="Primary">
      <a href="./#hero" class="nav-logo" id="nav-logo"><span class="logo-dot">__</span>gugu<span class="logo-dot">__</span></a>
      <ul class="nav-links">
        <li><a href="./#about">About</a></li>

      <div class="nav-actions">
        <div class="theme-menu">
          <button class="icon-btn" id="theme-btn" aria-haspopup="true" aria-expanded="false" aria-controls="theme-panel" aria-label="Change theme">
            <svg width="18" height="18" aria-hidden="true"><use href="./static/icons.svg#icon-palette"/></svg>
          </button>
          <div class="theme-panel" id="theme-panel" hidden>

            <div class="segmented" role="group" aria-label="Color mode" id="mode-group">
              <button data-mode="light"><svg width="15" height="15" aria-hidden="true"><use href="./static/icons.svg#icon-sun"/></svg>Light</button>
              <button data-mode="dark"><svg width="15" height="15" aria-hidden="true"><use href="./static/icons.svg#icon-moon"/></svg>Dark</button>
              <button data-mode="system"><svg width="15" height="15" aria-hidden="true"><use href="./static/icons.svg#icon-monitor"/></svg>Auto</button>
            </div>
            <p class="theme-panel-title">Accent</p>
            <div class="swatches" role="group" aria-label="Accent color" id="accent-group"></div>
          </div>
        </div>
        <a href="./#contact" class="btn btn-primary btn-sm nav-hire">Hire me</a>
        <button class="icon-btn nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-mobile">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

      <a href="./#about">About</a>
      <a href="./#skills">Skills</a>
      <a href="./#experience">Experience</a>
      <a href="./#projects">Projects</a>
      <a href="./#contact">Contact</a>
    </div>
  </header>

  <main id="main">

  </footer>


  <script src="./static/script.js"></script>

</html>
