<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="" />

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Prevent FOUC: apply saved theme before paint -->
  <script>
    (function(){
      var t = localStorage.getItem('theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme','light');
    })();
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
            surface: {
              50:  'var(--surface-50)',
              100: 'var(--surface-100)',
              800: 'var(--surface-800)',
              900: 'var(--surface-900)',
              950: 'var(--surface-950)',
            },
            slate: {
              300: 'var(--slate-300)',
              400: 'var(--slate-400)',
              500: 'var(--slate-500)',
              600: 'var(--slate-600)',
              700: 'var(--slate-700)',
              800: 'var(--slate-800)',
            },
            white: 'var(--color-white)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/TextPlugin.min.js"></script>

  <style>
    /* ── Theme CSS Variables ── */
    :root {
      --surface-50:  #f8fafc;
      --surface-100: #f1f5f9;
      --surface-800: #1e293b;
      --surface-900: #0f172a;
      --surface-950: #020617;
      --color-white: #ffffff;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      /* Semantic tokens */
      --bg-body: #020617;
      --text-body: #e2e8f0;
      --card-bg: rgba(15, 23, 42, 0.5);
      --overlay-bg: rgba(2, 6, 23, 0.85);
      --overlay-border: rgba(30, 41, 59, 0.5);
      --overlay-gradient: rgba(2, 6, 23, 0.95);
      --cursor-glow: rgba(6, 182, 212, 0.08);
      --grain-opacity: 0.03;
    }

    [data-theme="light"] {
      --surface-50:  #020617;
      --surface-100: #0f172a;
      --surface-800: #e2e8f0;
      --surface-900: #f1f5f9;
      --surface-950: #f8fafc;
      --color-white: #0f172a;
      --slate-300: #334155;
      --slate-400: #475569;
      --slate-500: #64748b;
      --slate-600: #94a3b8;
      --slate-700: #cbd5e1;
      --slate-800: #e2e8f0;
      /* Semantic tokens */
      --bg-body: #fcfcfc;
      --text-body: #1e293b;
      --card-bg: rgba(255, 255, 255, 0.7);
      --overlay-bg: rgba(252, 252, 252, 0.95);
      --overlay-border: rgba(226, 232, 240, 0.5);
      --overlay-gradient: rgba(252, 252, 252, 0.95);
      --cursor-glow: rgba(6, 182, 212, 0.08);
      --grain-opacity: 0.018;
    }

    /* ── Smooth theme transition ── */
    html, body, nav, section, footer, div, a, p, h1, h2, h3, span, ul, li,
    .timeline-card, .timeline-dot, .timeline-dot-inner, .timeline-track,
    .timeline-connector, .timeline-year, .skill-pill, .nav-link::after {
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* ── Base ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--bg-body); color: var(--text-body); overflow-x: hidden; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface-900); }
    ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 3px; }

    .grain::after {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: var(--grain-opacity);
    }

    .glow { box-shadow: 0 0 40px rgba(6, 182, 212, 0.15); }
    .glow-text { text-shadow: 0 0 30px rgba(6, 182, 212, 0.3); }

    /* ── Headline gradient shine sweep ── */
    #hero-tagline {
      background: linear-gradient(90deg,
        var(--slate-300) 0%,
        var(--slate-300) 35%,
        #06b6d4 50%,
        var(--slate-300) 65%,
        var(--slate-300) 100%
      );
      background-size: 300% auto;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-position: 100% center;
      transition: background-position 0.5s ease-out;
    }

    #hero-tagline.shine-sweep {
      animation: shine-sweep 3s ease-in-out;
      transition: none;
    }

    @keyframes shine-sweep {
      0% {
        background-position: 150% center;
      }
      100% {
        background-position: -50% center;
      }
    }

    .card-hover { transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.4s ease, background-color 0.4s ease, border-color 0.4s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 60px rgba(6, 182, 212, 0.1); }

    .magnetic-btn { transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

    /* ── Timeline ── */
    .timeline-track { position: absolute; left: 23px; top: 0; bottom: 0; width: 2px; background: var(--surface-800); }
    .timeline-progress { position: absolute; left: 23px; top: 0; width: 2px; height: 0; background: linear-gradient(to bottom, #06b6d4, #22d3ee); border-radius: 1px; }
    .timeline-progress::after {
      content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
      width: 8px; height: 8px; border-radius: 50%; background: #22d3ee;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.6), 0 0 30px rgba(6, 182, 212, 0.3);
    }
    @media (min-width: 768px) {
      .timeline-track { left: calc(50% - 1px); transform: none; }
      .timeline-progress { left: calc(50% - 1px); transform: none; }
    }
    .timeline-dot {
      width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--surface-800);
      background: var(--surface-900); display: flex; align-items: center; justify-content: center;
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); position: relative; z-index: 2;
    }
    .timeline-dot.active {
      border-color: #06b6d4; background: var(--surface-950);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3), 0 0 40px rgba(6, 182, 212, 0.1);
    }
    .timeline-dot-inner {
      width: 12px; height: 12px; border-radius: 50%; background: var(--slate-700); transition: all 0.5s ease;
    }
    .timeline-dot.active .timeline-dot-inner { background: #06b6d4; box-shadow: 0 0 8px rgba(6, 182, 212, 0.6); }
    .timeline-card {
      background: var(--card-bg); border: 1px solid var(--surface-800); border-radius: 1rem;
      padding: 2rem; transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative; overflow: hidden;
    }
    .timeline-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 0;
      background: linear-gradient(to bottom, #06b6d4, #22d3ee);
      transition: height 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .timeline-card.active { border-color: rgba(6, 182, 212, 0.3); box-shadow: 0 10px 40px rgba(6, 182, 212, 0.08); }
    .timeline-card.active::before { height: 100%; }
    .timeline-connector {
      position: absolute; top: 24px; width: 40px; height: 2px; background: var(--surface-800);
      transition: background 0.5s ease;
    }
    .timeline-connector.active { background: #06b6d4; }
    @media (min-width: 768px) {
      .exp-row:nth-child(odd) .timeline-connector { right: -40px; }
      .exp-row:nth-child(even) .timeline-connector { left: -40px; }
    }

    /* ── Current timeline item ── */
    .current-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(34, 211, 238, 0.1) 100%);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 12px;
      color: #06b6d4;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      animation: badgePulse 2s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.4);
      }
      50% {
        box-shadow: 0 0 0 4px rgba(6, 182, 212, 0);
      }
    }

    .timeline-dot-current {
      border-color: #06b6d4 !important;
      background: var(--surface-950) !important;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.5), 0 0 40px rgba(6, 182, 212, 0.2) !important;
      animation: dotPulse 2s ease-in-out infinite;
    }

    .timeline-dot-current .timeline-dot-inner {
      background: #06b6d4 !important;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.8) !important;
    }

    @keyframes dotPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    .timeline-card-current {
      border-color: rgba(6, 182, 212, 0.4) !important;
      box-shadow: 0 10px 50px rgba(6, 182, 212, 0.15) !important;
    }

    .timeline-card-current::before {
      height: 100% !important;
    }

    /* ── Timeline current celebration ── */
    .timeline-celebration {
      position: absolute;
      pointer-events: none;
      z-index: 20;
    }
    .celebration-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      opacity: 1;
    }
    .celebration-ring {
      position: absolute;
      border: 2px solid rgba(6, 182, 212, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }

    /* ── Typing effect ── */
    .typing-text {
      display: inline;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #06b6d4;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .typing-text-company .typing-cursor,
    .typing-text-achievement .typing-cursor {
      display: none;
    }

    .achievement-item {
      opacity: 1;
    }

    .typing-text-achievement {
      min-height: 1em;
      display: inline-block;
    }

    .timeline-year {
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.1em;
      color: var(--slate-600); transition: color 0.5s ease;
    }
    .timeline-year.active { color: #06b6d4; }

    .skill-pill { transition: all 0.3s ease; }
    .skill-pill:hover { background-color: #06b6d4; color: var(--surface-950); transform: scale(1.05); }

    /* ── Project filter tabs ── */
    .project-filter-btn {
      background: transparent;
      border: 1px solid var(--surface-800);
      color: var(--text-body);
      cursor: pointer;
    }
    .project-filter-btn:hover {
      border-color: rgba(6, 182, 212, 0.4);
      color: #06b6d4;
    }
    .project-filter-btn.active {
      background: #06b6d4;
      border-color: #06b6d4;
      color: var(--surface-950);
      font-weight: 600;
    }
    .project-card { transition: opacity 0.4s ease, transform 0.4s ease; }
    .project-card.hidden-card { opacity: 0; transform: scale(0.95); position: absolute; pointer-events: none; visibility: hidden; height: 0; overflow: hidden; }

    .cursor-follower {
      width: 300px; height: 300px;
      background: radial-gradient(circle, var(--cursor-glow) 0%, transparent 70%);
      border-radius: 50%; position: fixed; pointer-events: none; z-index: 0;
      transform: translate(-50%, -50%); transition: opacity 0.3s ease;
    }

    .nav-link { position: relative; }
    .nav-link::after {
      content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px;
      background: #06b6d4; transition: width 0.3s ease;
    }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }

    .project-overlay { background: linear-gradient(to top, var(--overlay-gradient) 0%, transparent 100%); }

    /* ── Gallery animations ── */
    #gallery-grid { perspective: 1200px; }
    .gallery-item {
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }
    .gallery-shimmer {
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: overlay;
    }

    /* ── Skill card gradients ── */
    .skill-bg-0 { background: linear-gradient(135deg, rgba(6, 182, 212, 0.08) 0%, rgba(34, 211, 238, 0.04) 50%, transparent 100%); }
    .skill-bg-1 { background: linear-gradient(135deg, rgba(168, 85, 247, 0.08) 0%, rgba(217, 70, 239, 0.04) 50%, transparent 100%); }
    .skill-bg-2 { background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(20, 184, 166, 0.04) 50%, transparent 100%); }
    .skill-bg-3 { background: linear-gradient(135deg, rgba(251, 146, 60, 0.08) 0%, rgba(251, 191, 36, 0.04) 50%, transparent 100%); }
    .skill-bg-4 { background: linear-gradient(135deg, rgba(59, 130, 246, 0.08) 0%, rgba(99, 102, 241, 0.04) 50%, transparent 100%); }
    .skill-bg-5 { background: linear-gradient(135deg, rgba(236, 72, 153, 0.08) 0%, rgba(244, 114, 182, 0.04) 50%, transparent 100%); } .skill-bg-6 { background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(234, 179, 8, 0.04) 50%, transparent 100%); } .skill-bg-7 { background: linear-gradient(135deg, rgba(217, 70, 239, 0.08) 0%, rgba(192, 38, 211, 0.04) 50%, transparent 100%); }
    .skill-bg-6 { background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(234, 179, 8, 0.04) 50%, transparent 100%); } .skill-bg-7 { background: linear-gradient(135deg, rgba(217, 70, 239, 0.08) 0%, rgba(192, 38, 211, 0.04) 50%, transparent 100%); }
    .skill-bg-7 { background: linear-gradient(135deg, rgba(217, 70, 239, 0.08) 0%, rgba(192, 38, 211, 0.04) 50%, transparent 100%); }
    
    /* ── Project cards ── */
    #projects-grid { perspective: 1200px; }
    .project-card {
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    /* ── Project fallback gradients ── */
    .project-img-container {
      position: relative;
      height: 224px; /* h-56 = 14rem = 224px */
      overflow: hidden;
      background: var(--surface-800);
    }

    .project-img-fallback {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: fallbackFadeIn 0.3s ease-out forwards;
      transition: transform 0.7s ease-out;
    }

    .project-img-fallback::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 2;
    }

    @keyframes fallbackFadeIn {
      from {
        opacity: 0;
        transform: scale(0.98);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Gradient variants - 8 unique color combinations */
    .fallback-gradient-0 {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.15) 0%, rgba(34, 211, 238, 0.08) 50%, rgba(6, 182, 212, 0.05) 100%);
    }

    .fallback-gradient-1 {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.15) 0%, rgba(217, 70, 239, 0.08) 50%, rgba(168, 85, 247, 0.05) 100%);
    }

    .fallback-gradient-2 {
      background: linear-gradient(135deg, rgba(251, 146, 60, 0.15) 0%, rgba(251, 191, 36, 0.08) 50%, rgba(251, 146, 60, 0.05) 100%);
    }

    .fallback-gradient-3 {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.15) 0%, rgba(244, 114, 182, 0.08) 50%, rgba(236, 72, 153, 0.05) 100%);
    }

    .fallback-gradient-4 {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(20, 184, 166, 0.08) 50%, rgba(16, 185, 129, 0.05) 100%);
    }

    .fallback-gradient-5 {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(99, 102, 241, 0.08) 50%, rgba(59, 130, 246, 0.05) 100%);
    }

    .fallback-gradient-6 {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(234, 179, 8, 0.08) 50%, rgba(245, 158, 11, 0.05) 100%);
    }

    .fallback-gradient-7 {
      background: linear-gradient(135deg, rgba(217, 70, 239, 0.15) 0%, rgba(192, 38, 211, 0.08) 50%, rgba(217, 70, 239, 0.05) 100%);
    }

    /* Ensure hover scale animation works on fallback */
    .project-card:hover .project-img-fallback {
      transform: scale(1.1);
    }

    /* ── Theme toggle button ── */
    .theme-toggle {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--surface-800);
      background: var(--surface-900); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
    }
    .theme-toggle:hover { border-color: #06b6d4; background: var(--surface-950); }
    .theme-toggle svg { width: 18px; height: 18px; transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s ease; }
    .theme-toggle .icon-sun { position: absolute; color: #f59e0b; opacity: 0; transform: rotate(-90deg) scale(0.5); }
    .theme-toggle .icon-moon { position: absolute; color: #06b6d4; opacity: 1; transform: rotate(0deg) scale(1); }
    [data-theme="light"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
    [data-theme="light"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0.5); }
  </style>
</head>
<body class="grain font-sans">

  <!-- Cursor Follower -->
  <div class="cursor-follower" id="cursor"></div>

  <!-- Navigation -->
  <nav id="navbar" class="fixed top-0 left-0 w-full z-50 transition-all duration-500">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

      <div id="nav-links" class="hidden md:flex items-center gap-8"></div>
      <div class="flex items-center gap-3">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <!-- Moon icon (dark mode indicator) -->
          <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <!-- Sun icon (light mode indicator) -->
          <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
        <button id="mobile-menu-btn" class="md:hidden text-slate-300 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      </div>
    </div>
    <div id="mobile-menu" class="md:hidden hidden bg-surface-950/95 backdrop-blur-xl border-t border-slate-800">
      <div id="mobile-menu-links" class="px-6 py-4 flex flex-col gap-4"></div>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="relative min-h-screen flex items-center justify-center overflow-hidden">
    <canvas id="code-particles-canvas" class="absolute inset-0 w-full h-full" style="pointer-events: none; z-index: 1;"></canvas>
    <div class="absolute inset-0 opacity-[0.04]" style="background-image: linear-gradient(rgba(6,182,212,0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,0.3) 1px, transparent 1px); background-size: 60px 60px;"></div>
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-cyan-500/10 rounded-full blur-[120px] animate-pulse" id="orb1"></div>

    function initGSAP() {
      // Register GSAP plugins

      // Cursor

      let mouseX = 0, mouseY = 0;
      document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

      if ('ontouchstart' in window) cursor.style.display = 'none';

      // Navbar
      const navbar = document.getElementById('navbar');
      ScrollTrigger.create({
        start: 'top -80',
        onUpdate: self => {
          if (self.direction === 1) {
            navbar.style.background = 'var(--overlay-bg)';
            navbar.style.backdropFilter = 'blur(20px)';
            navbar.style.borderBottom = '1px solid var(--overlay-border)';
          }
          if (self.scroll() < 80) {
            navbar.style.background = 'transparent';
            navbar.style.backdropFilter = 'none';
            navbar.style.borderBottom = 'none';
          }
        }
      });

      // Theme toggle
      const themeToggle = document.getElementById('theme-toggle');
      themeToggle.addEventListener('click', () => {
        const html = document.documentElement;
        const isLight = html.getAttribute('data-theme') === 'light';
        if (isLight) {
          html.removeAttribute('data-theme');
          localStorage.setItem('theme', 'dark');
        } else {
          html.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
        }
      });

      // Mobile menu
      const mobileMenuBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      mobileMenuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
      mobileMenu.querySelectorAll('a').forEach(link =>
        link.addEventListener('click', () => mobileMenu.classList.add('hidden'))
      );

      // Hero timeline
      const heroTl = gsap.timeline({ defaults: { ease: 'power3.out' } });
      const nameEl = document.getElementById('hero-name');
      nameEl.style.opacity = 1; // container visible, chars animate individually
      const chars = nameEl.querySelectorAll('.split-char');

      heroTl
        .to('#hero-greeting', { opacity: 1, y: 0, duration: 0.8 }, 0.3)
        .from('#hero-greeting', { y: 30 }, 0.3)
        // SplitText: each character with smooth animation
        .fromTo(chars, {
          opacity: 0,
          y: 60,
          rotateX: -45,
          scale: 0.8,
        }, {
          opacity: 1,
          y: 0,
          rotateX: 0,
          scale: 1,
          duration: 0.8,
          stagger: 0.05,
          ease: 'power3.out',
        }, 0.6)
        .to('#hero-tagline', {
          opacity: 1,
          duration: 0.8,
          onComplete: () => {
            // Trigger the shine sweep animation
            const tagline = document.getElementById('hero-tagline');
            tagline.classList.add('shine-sweep');

            // Remove the class after animation completes to reset to normal gradient position
            setTimeout(() => {
              tagline.classList.remove('shine-sweep');
            }, 3000);
          }
        }, 1.4)
        .from('#hero-tagline', { y: 30 }, 1.4)
        .to('#hero-desc', { opacity: 1, duration: 0.8 }, 1.7)
        .from('#hero-desc', { y: 20 }, 1.7)
        .to('#hero-cta', { opacity: 1, duration: 0.8 }, 2.0)
        .from('#hero-cta', { y: 20 }, 2.0)
        .to('#scroll-indicator', { opacity: 1, duration: 0.8 }, 2.4);

      gsap.to('#orb1', { x: 50, y: -30, duration: 6, repeat: -1, yoyo: true, ease: 'sine.inOut' });
      gsap.to('#orb2', { x: -40, y: 40, duration: 8, repeat: -1, yoyo: true, ease: 'sine.inOut' });
      gsap.to('#scroll-indicator', { opacity: 0, scrollTrigger: { trigger: '#about', start: 'top bottom', end: 'top center', scrub: true } });

      // About
      gsap.utils.toArray('.about-reveal').forEach((el, i) => {
        gsap.from(el, { opacity: 0, y: 40, duration: 0.8, delay: i * 0.15, scrollTrigger: { trigger: el, start: 'top 85%', toggleActions: 'play none none none' } });
      });

      // Counters
      document.querySelectorAll('.counter').forEach(counter => {
        const target = parseInt(counter.dataset.target);
        gsap.to(counter, { innerText: target, duration: 2, ease: 'power2.out', snap: { innerText: 1 }, scrollTrigger: { trigger: counter, start: 'top 85%', toggleActions: 'play none none none' } });
      });
      gsap.from('.stat-card', { opacity: 0, y: 30, scale: 0.95, duration: 0.6, stagger: 0.15, scrollTrigger: { trigger: '.stat-card', start: 'top 85%', toggleActions: 'play none none none' } });

      // Experience - section header
      gsap.from('.exp-reveal', { opacity: 0, y: 40, duration: 0.8, scrollTrigger: { trigger: '.exp-reveal', start: 'top 85%', toggleActions: 'play none none none' } });

      // Experience - scroll-driven timeline progress line
      const timelineContainer = document.getElementById('experience-timeline');
      const progressBar = document.getElementById('timeline-progress');
      if (timelineContainer && progressBar) {
        gsap.to(progressBar, {
          height: '100%',
          ease: 'none',
          scrollTrigger: {
            trigger: timelineContainer,
            start: 'top 60%',
            end: 'bottom 40%',
            scrub: 0.3,
          }
        });
      }

      // Experience - each row: card slide-in + dot/card activation
      gsap.utils.toArray('.exp-row').forEach((row, i) => {
        const isEven = i % 2 === 0;
        const cards = row.querySelectorAll('.timeline-card');
        const dots = row.querySelectorAll('.timeline-dot');
        const years = row.querySelectorAll('.timeline-year');

        // Cards slide in from the side they sit on
        cards.forEach(card => {
          gsap.from(card, {
            opacity: 0,
            x: isEven ? -60 : 60,
            duration: 0.8,
            ease: 'power3.out',
            scrollTrigger: { trigger: row, start: 'top 78%', toggleActions: 'play none none none' }
          });
        });

        // Dots scale in
        dots.forEach(dot => {
          gsap.from(dot, {
            scale: 0,
            duration: 0.5,
            ease: 'back.out(2)',
            scrollTrigger: { trigger: row, start: 'top 78%', toggleActions: 'play none none none' }
          });
        });

        // Typing animation for timeline text
        cards.forEach(card => {
          const typingElements = card.querySelectorAll('.typing-text');
          const cursor = card.querySelector('.typing-cursor');

          typingElements.forEach((element, idx) => {
            const text = element.getAttribute('data-text');
            const isRole = !element.classList.contains('typing-text-company') && !element.classList.contains('typing-text-achievement');
            const isCompany = element.classList.contains('typing-text-company');
            const isAchievement = element.classList.contains('typing-text-achievement');

            // Calculate delays - role first, then company, then achievements
            let baseDelay = 0.9; // After card slides in
            if (isCompany) baseDelay = 1.4; // After role finishes
            if (isAchievement) {
              const achievementIndex = element.closest('.achievement-item').getAttribute('data-achievement-index');
              baseDelay = 1.8 + (parseFloat(achievementIndex) * 0.8); // Stagger achievements
            }

            ScrollTrigger.create({
              trigger: row,
              start: 'top 78%',
              onEnter: () => {
                // Type out the text character by character
                let currentText = '';
                const chars = text.split('');
                const typingSpeed = isAchievement ? 0.015 : 0.03; // Faster for achievements

                gsap.to({}, {
                  duration: chars.length * typingSpeed,
                  delay: baseDelay,
                  onUpdate: function() {
                    const progress = this.progress();
                    const charIndex = Math.floor(progress * chars.length);

                    if (charIndex < chars.length) {
                      currentText = chars.slice(0, charIndex + 1).join('');
                      element.textContent = currentText;

                      // Show cursor on active element
                      if (cursor && isRole) {
                        cursor.style.display = 'inline-block';
                      }
                    }
                  },
                  onComplete: () => {
                    element.textContent = text;
                    // Hide cursor after role is complete
                    if (cursor && isRole) {
                      gsap.to(cursor, {
                        opacity: 0,
                        duration: 0.3,
                        delay: 0.2
                      });
                    }
                  }
                });
              }
            });
          });
        });

        // Toggle active class on all matching elements when row is in view
        const activate = () => {
          dots.forEach(d => d.classList.add('active'));
          cards.forEach(c => c.classList.add('active'));
          years.forEach(y => y.classList.add('active'));
        };
        const deactivate = () => {
          dots.forEach(d => d.classList.remove('active'));
          cards.forEach(c => c.classList.remove('active'));
          years.forEach(y => y.classList.remove('active'));
        };

        ScrollTrigger.create({
          trigger: row,
          start: 'top 65%',
          end: 'bottom 35%',
          onEnter: activate,
          onLeave: deactivate,
          onEnterBack: activate,
          onLeaveBack: deactivate,
        });

        // Special pop animation for the last/current timeline item
        if (row.classList.contains('exp-row-current')) {
          const currentTl = gsap.timeline({
            scrollTrigger: {
              trigger: row,
              start: 'top 75%',
              toggleActions: 'play none none none'
            }
          });

          // Card entrance
          currentTl.from(row, {
            scale: 0.92,
            opacity: 0,
            duration: 0.8,
            ease: 'back.out(1.4)',
          });

          // Badge pop
          const badge = row.querySelector('.current-badge');
          if (badge) {
            currentTl.from(badge, {
              scale: 0,
              opacity: 0,
              duration: 0.5,
              ease: 'back.out(2)',
            }, '-=0.3');
          }

          // Particle burst from the current dot
          const currentDot = row.querySelector('.timeline-dot-current');
          if (currentDot) {
            ScrollTrigger.create({
              trigger: row,
              start: 'top 75%',
              once: true,
              onEnter: () => {
                const dotRect = currentDot.getBoundingClientRect();
                const sectionRect = document.getElementById('experience').getBoundingClientRect();
                const cx = dotRect.left + dotRect.width / 2 - sectionRect.left;
                const cy = dotRect.top + dotRect.height / 2 - sectionRect.top;

                // Create celebration container
                const container = document.createElement('div');
                container.className = 'timeline-celebration';
                container.style.left = cx + 'px';
                container.style.top = cy + 'px';
                document.getElementById('experience').appendChild(container);

                // Expanding rings
                for (let r = 0; r < 3; r++) {
                  const ring = document.createElement('div');
                  ring.className = 'celebration-ring';
                  ring.style.width = '0px';
                  ring.style.height = '0px';
                  ring.style.left = '0px';
                  ring.style.top = '0px';
                  ring.style.opacity = '0.8';
                  container.appendChild(ring);
                  const size = 100 + r * 60;
                  gsap.to(ring, {
                    width: size,
                    height: size,
                    left: -size / 2,
                    top: -size / 2,
                    opacity: 0,
                    duration: 1.2 + r * 0.3,
                    delay: 0.05 + r * 0.15,
                    ease: 'power2.out',
                  });
                }

                // Particles burst outward
                const colors = ['#06b6d4', '#22d3ee', '#67e8f9', '#a5f3fc', '#06b6d4', '#0e7490'];
                const particleCount = 30;
                for (let p = 0; p < particleCount; p++) {
                  const particle = document.createElement('div');
                  particle.className = 'celebration-particle';
                  const size = 4 + Math.random() * 7;
                  particle.style.width = size + 'px';
                  particle.style.height = size + 'px';
                  particle.style.background = colors[p % colors.length];
                  particle.style.left = '0px';
                  particle.style.top = '0px';
                  particle.style.boxShadow = `0 0 ${size * 3}px ${colors[p % colors.length]}`;
                  container.appendChild(particle);

                  const angle = (p / particleCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
                  const dist = 60 + Math.random() * 120;
                  const tx = Math.cos(angle) * dist;
                  const ty = Math.sin(angle) * dist;

                  gsap.fromTo(particle, {
                    scale: 1,
                    opacity: 1,
                  }, {
                    x: tx,
                    y: ty,
                    opacity: 0,
                    scale: 0,
                    duration: 1 + Math.random() * 0.8,
                    delay: 0.1 + Math.random() * 0.15,
                    ease: 'power3.out',
                  });
                }

                // Dot flash
                gsap.fromTo(currentDot, {
                  boxShadow: '0 0 20px rgba(6,182,212,0.5), 0 0 40px rgba(6,182,212,0.2)',
                }, {
                  boxShadow: '0 0 50px rgba(6,182,212,0.9), 0 0 100px rgba(6,182,212,0.4), 0 0 150px rgba(6,182,212,0.2)',
                  duration: 0.6,
                  delay: 0.1,
                  yoyo: true,
                  repeat: 2,
                  ease: 'power2.inOut',
                });

                // Clean up after animation
                setTimeout(() => container.remove(), 3000);
              }
            });
          }
        }
      });

      // Skills
      gsap.from('.skills-reveal', { opacity: 0, y: 40, duration: 0.8, scrollTrigger: { trigger: '.skills-reveal', start: 'top 85%', toggleActions: 'play none none none' } });

      const skillCards = gsap.utils.toArray('.skill-category');
      if (skillCards.length) {
        gsap.fromTo(skillCards,
          { opacity: 0, y: 40, scale: 0.95 },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            duration: 0.6,
            stagger: 0.12,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: '#skills-grid',
              start: 'top 80%',
              toggleActions: 'play none none none'
            }
          }
        );
      }

      // Projects
      gsap.from('.projects-reveal', { opacity: 0, y: 40, duration: 0.8, scrollTrigger: { trigger: '.projects-reveal', start: 'top 85%', toggleActions: 'play none none none' } });

      const projectCards = gsap.utils.toArray('.project-card');
      if (projectCards.length) {
        gsap.fromTo(projectCards,
          { opacity: 0, y: 60, rotateX: 15, scale: 0.9 },
          {
            opacity: 1,
            y: 0,
            rotateX: 0,
            scale: 1,
            duration: 0.8,
            stagger: 0.15,
            ease: 'power3.out',
            scrollTrigger: {
              trigger: '#projects-grid',
              start: 'top 80%',
              toggleActions: 'play none none none'
            }
          }
        );

        // Animate project images with parallax on hover
        projectCards.forEach(card => {
          const img = card.querySelector('img');
          const fallback = card.querySelector('.project-img-fallback');

          if (img || fallback) {
            card.addEventListener('mousemove', (e) => {
              const rect = card.getBoundingClientRect();
              const x = (e.clientX - rect.left - rect.width / 2) / 20;
              const y = (e.clientY - rect.top - rect.height / 2) / 20;

              if (img && img.style.display !== 'none') {
                gsap.to(img, { x, y, duration: 0.5, ease: 'power2.out' });
              } else if (fallback) {
                gsap.to(fallback, { x, y, duration: 0.5, ease: 'power2.out' });
              }
            });

            card.addEventListener('mouseleave', () => {
              if (img && img.style.display !== 'none') {
                gsap.to(img, { x: 0, y: 0, duration: 0.6, ease: 'power2.out' });
              } else if (fallback) {
                gsap.to(fallback, { x: 0, y: 0, duration: 0.6, ease: 'power2.out' });
              }
            });
          }
        });
      }

      // GitHub
      gsap.utils.toArray('.gh-reveal').forEach(el => {
        gsap.fromTo(el,
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.8, scrollTrigger: { trigger: el, start: 'top 85%', toggleActions: 'play none none none' } }
        );
      });

      const ghCards = gsap.utils.toArray('.gh-card');
      if (ghCards.length) {
        gsap.fromTo(ghCards,
          { opacity: 0, y: 50 },
          {
            opacity: 1,
            y: 0,
            duration: 0.7,
            stagger: 0.15,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: '#github-grid',
              start: 'top 80%',
              toggleActions: 'play none none none'
            }
          }
        );
      }

      // Gallery
      gsap.from('.gallery-reveal', { opacity: 0, y: 40, duration: 0.8, scrollTrigger: { trigger: '.gallery-reveal', start: 'top 85%', toggleActions: 'play none none none' } });

      const galleryItems = gsap.utils.toArray('.gallery-item');
      if (galleryItems.length) {
        // Animate containers with enhanced effects
        gsap.fromTo(galleryItems,
          {
            opacity: 0,
            y: 80,
            scale: 0.85,
            rotateY: -15,
          },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            rotateY: 0,
            duration: 1,
            stagger: {
              amount: 0.6,
              from: 'start',
              ease: 'power2.inOut'
            },
            ease: 'power3.out',
            scrollTrigger: {
              trigger: '#gallery-grid',
              start: 'top 80%',
              toggleActions: 'play none none none'
            }
          }
        );

        // Animate images with clip-path reveal
        const galleryImages = gsap.utils.toArray('.gallery-img');
        gsap.fromTo(galleryImages,
          {
            clipPath: 'inset(0% 100% 0% 0%)',
            scale: 1.3,
          },
          {
            clipPath: 'inset(0% 0% 0% 0%)',
            scale: 1,
            duration: 1.2,
            stagger: {
              amount: 0.6,
              from: 'start',
              ease: 'power2.inOut'
            },
            ease: 'power2.out',
            scrollTrigger: {
              trigger: '#gallery-grid',
              start: 'top 80%',
              toggleActions: 'play none none none'
            }
          }
        );

        // Shimmer effect sweep
        const shimmers = gsap.utils.toArray('.gallery-shimmer');
        gsap.to(shimmers, {
          x: '200%',
          duration: 1.5,
          stagger: {
            amount: 0.6,
            from: 'start'
          },
          ease: 'power2.inOut',
          scrollTrigger: {
            trigger: '#gallery-grid',
            start: 'top 80%',
            toggleActions: 'play none none none'
          }
        });

        // Border glow effect on reveal
        galleryItems.forEach((item, i) => {
          gsap.to(item, {
            borderColor: 'rgba(6, 182, 212, 0.3)',
            duration: 0.5,
            delay: i * 0.2,
            yoyo: true,
            repeat: 1,
            scrollTrigger: {
              trigger: '#gallery-grid',
              start: 'top 80%',
              toggleActions: 'play none none none'
            }
          });
        });
      }

      // Contact
      const contactReveals = gsap.utils.toArray('.contact-reveal');
      if (contactReveals.length) {
        gsap.fromTo(contactReveals,
          { opacity: 0, y: 40 },
          {
            opacity: 1,
            y: 0,
            duration: 0.8,
            stagger: 0.15,
            scrollTrigger: {
              trigger: '#contact',
              start: 'top 75%',
              toggleActions: 'play none none none'
            }
          }
        );
      }

      const contactCards = gsap.utils.toArray('.contact-card');
      if (contactCards.length) {
        gsap.fromTo(contactCards,
          { opacity: 0, y: 30, scale: 0.95 },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            duration: 0.6,
            stagger: 0.08,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: '#contact-grid',
              start: 'top 80%',
              toggleActions: 'play none none none'
            }
          }
        );
      }

      // Parallax
      gsap.to('#hero-name', { yPercent: -20, scrollTrigger: { trigger: '#hero', start: 'top top', end: 'bottom top', scrub: 1 } });
      gsap.to('#hero-tagline', { yPercent: -10, scrollTrigger: { trigger: '#hero', start: 'top top', end: 'bottom top', scrub: 1 } });

      // Active nav tracking
      const sections = document.querySelectorAll('section[id]');
      const navLinks = document.querySelectorAll('.nav-link');
      ScrollTrigger.create({
        start: 'top top', end: 'bottom bottom',
        onUpdate: () => {
          let current = '';
          sections.forEach(section => { if (window.scrollY >= section.offsetTop - 200) current = section.id; });
          navLinks.forEach(link => {
            link.classList.toggle('active', link.getAttribute('href') === `#${current}`);
          });
        }
      });

      // Magnetic buttons
      document.querySelectorAll('.magnetic-btn').forEach(btn => {
        btn.addEventListener('mousemove', e => {
          const rect = btn.getBoundingClientRect();
          gsap.to(btn, {
            x: (e.clientX - rect.left - rect.width / 2) * 0.2,
            y: (e.clientY - rect.top - rect.height / 2) * 0.2,
            duration: 0.4,
            ease: 'power2.out'
          });
        });
        btn.addEventListener('mouseleave', () => {
          gsap.to(btn, {
            x: 0,
            y: 0,
            duration: 0.6,
            ease: 'power2.out'
          });
        });
      });
    }

    // ── Floating Code Particles Animation ──
    (function initCodeParticles() {
      const canvas = document.getElementById('code-particles-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let dpr = window.devicePixelRatio || 1;
      let W, H;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        const rect = canvas.parentElement.getBoundingClientRect();
        W = rect.width;
        H = rect.height;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      // Code tokens that float around
      const tokens = [
        'def', 'class', 'import', 'return', 'async', 'await', 'yield',
        'for', 'while', 'if', 'else', 'try', 'except', 'with',
        'lambda', 'self', 'None', 'True', 'False',
        'flask', 'openai', 'docker', 'git', 'npm',
        '()', '{}', '[]', '=>', '::', '//', '/**/',
        'print()', '.get()', '.post()', '.map()', '.filter()',
        'const', 'let', 'fn', 'pub', 'use',
        '<div>', '</>', '&&', '||', '!=', '===',
        'pip', 'brew', 'kubectl', 'terraform',
        '0x3F', '127.0.0.1', ':8080', 'utf-8',
      ];

      const PARTICLE_COUNT = 45;
      let particles = [];
      let mouse = { x: -1000, y: -1000 };

      // Track mouse for subtle interaction
      canvas.parentElement.addEventListener('mousemove', (e) => {
        const rect = canvas.parentElement.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      });

      function createParticle(init) {
        const size = 10 + Math.random() * 14;
        return {
          text: tokens[Math.floor(Math.random() * tokens.length)],
          x: init ? Math.random() * W : (Math.random() < 0.5 ? -100 : W + 100),
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.2,
          size,
          baseAlpha: 0.06 + Math.random() * 0.12,
          alpha: 0,
          targetAlpha: 0.06 + Math.random() * 0.12,
          rotation: (Math.random() - 0.5) * 0.3,
          rotationSpeed: (Math.random() - 0.5) * 0.002,
          phase: Math.random() * Math.PI * 2,       // for sine drift
          driftAmp: 0.2 + Math.random() * 0.5,      // sine amplitude
          driftFreq: 0.0003 + Math.random() * 0.0005, // sine frequency
          life: 0,
          maxLife: 8000 + Math.random() * 12000,     // 8–20 seconds
          fadeIn: 1500 + Math.random() * 1000,
          fadeOut: 2000 + Math.random() * 1000,
        };
      }

      // Initialize particles
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = createParticle(true);
        p.life = Math.random() * p.maxLife; // stagger initial lifetimes
        particles.push(p);
      }

      let lastTime = 0;

      function animate(time) {
        requestAnimationFrame(animate);
        const dt = Math.min(time - lastTime, 50);
        lastTime = time;

        ctx.clearRect(0, 0, W, H);

        const isDark = !document.documentElement.classList.contains('light');

        particles.forEach((p, i) => {
          p.life += dt;

          // Respawn if expired
          if (p.life > p.maxLife) {
            particles[i] = createParticle(false);
            return;
          }

          // Fade in/out
          let alpha = p.baseAlpha;
          if (p.life < p.fadeIn) {
            alpha *= p.life / p.fadeIn;
          } else if (p.life > p.maxLife - p.fadeOut) {
            alpha *= (p.maxLife - p.life) / p.fadeOut;
          }

          // Gentle sine wave drift
          const drift = Math.sin(time * p.driftFreq + p.phase) * p.driftAmp;

          // Mouse repulsion (subtle)
          let pushX = 0, pushY = 0;
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 150 && dist > 0) {
            const force = (150 - dist) / 150 * 0.5;
            pushX = (dx / dist) * force;
            pushY = (dy / dist) * force;
          }

          p.x += (p.vx + drift * 0.02 + pushX) * (dt / 16);
          p.y += (p.vy + pushY) * (dt / 16);
          p.rotation += p.rotationSpeed * dt;

          // Wrap around edges with margin
          if (p.x < -150) p.x = W + 100;
          if (p.x > W + 150) p.x = -100;
          if (p.y < -100) p.y = H + 50;
          if (p.y > H + 100) p.y = -50;

          // Draw
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.font = `${p.size}px ui-monospace, SFMono-Regular, Menlo, Monaco, monospace`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          if (isDark) {
            ctx.fillStyle = `rgba(6, 182, 212, ${alpha})`;
          } else {
            ctx.fillStyle = `rgba(15, 118, 110, ${alpha * 3})`;
          }

          // Subtle glow on nearby particles
          if (dist < 200) {
            const glowIntensity = (200 - dist) / 200 * 0.15;
            if (isDark) {
              ctx.shadowColor = 'rgba(6, 182, 212, 0.3)';
            } else {
              ctx.shadowColor = 'rgba(15, 118, 110, 0.2)';
            }
            ctx.shadowBlur = 15 * glowIntensity;
          }

          ctx.fillText(p.text, 0, 0);
          ctx.restore();
        });

        // Draw faint connecting lines between nearby particles
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const a = particles[i];
            const b = particles[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              const lineAlpha = (1 - dist / 120) * (isDark ? 0.04 : 0.08);
              ctx.strokeStyle = isDark
                ? `rgba(6, 182, 212, ${lineAlpha})`
                : `rgba(15, 118, 110, ${lineAlpha})`;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }
      }

      requestAnimationFrame(animate);
    })();
  </script>
