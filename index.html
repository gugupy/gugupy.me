<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <meta name="description" content="" />

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Prevent FOUC: apply saved theme before paint -->
  <script>
    (function(){
      var t = localStorage.getItem('theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme','light');
    })();
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: { 400: 'var(--accent-400)', 500: 'var(--accent-500)', 600: 'var(--accent-600)' },
            surface: {
              50:  'var(--surface-50)',
              100: 'var(--surface-100)',
              800: 'var(--surface-800)',
              900: 'var(--surface-900)',
              950: 'var(--surface-950)',
            },
            slate: {
              300: 'var(--slate-300)',
              400: 'var(--slate-400)',
              500: 'var(--slate-500)',
              600: 'var(--slate-600)',
              700: 'var(--slate-700)',
              800: 'var(--slate-800)',
            },
            white: 'var(--color-white)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/TextPlugin.min.js"></script>
  <link rel="stylesheet" href="static/styles.css" />
</head>
<body class="grain font-sans">

  <!-- Cursor Follower -->
  <div class="cursor-follower" id="cursor"></div>

  <!-- Navigation -->
  <nav id="navbar" class="fixed top-0 left-0 w-full z-50 transition-all duration-500">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="#hero" id="nav-brand" class="text-xl font-bold font-mono text-cyan-400 tracking-tight"></a>
      <div id="nav-links" class="hidden md:flex items-center gap-8"></div>
      <div class="flex items-center gap-3">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <!-- Moon icon (dark mode indicator) -->
          <svg class="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <!-- Sun icon (light mode indicator) -->
          <svg class="icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
        <button id="mobile-menu-btn" class="md:hidden text-slate-300 hover:text-cyan-400 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      </div>
    </div>
    <div id="mobile-menu" class="md:hidden hidden bg-surface-950/95 backdrop-blur-xl border-t border-slate-800">
      <div id="mobile-menu-links" class="px-6 py-4 flex flex-col gap-4"></div>
    </div>
  </nav>

  <!-- HERO -->
  <section id="hero" class="relative min-h-screen flex items-center justify-center overflow-hidden">
    <canvas id="code-particles-canvas" class="absolute inset-0 w-full h-full" style="pointer-events: none; z-index: 1;"></canvas>
    <div class="absolute inset-0 opacity-[0.04]" style="background-image: linear-gradient(rgba(var(--accent-rgb),0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--accent-rgb),0.3) 1px, transparent 1px); background-size: 60px 60px;"></div>
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-cyan-500/10 rounded-full blur-[120px] animate-pulse" id="orb1"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-600/5 rounded-full blur-[150px]" id="orb2"></div>
    <div class="relative z-10 max-w-5xl mx-auto px-6 text-center">
      <div id="hero-greeting" class="opacity-0 mb-6"></div>
      <h1 id="hero-name" class="text-6xl md:text-8xl lg:text-9xl font-black tracking-tighter mb-6 opacity-0" style="perspective:600px"></h1>
      <p id="hero-tagline" class="text-2xl md:text-4xl font-light text-slate-300 mb-4 opacity-0 glow-text"></p>
      <p id="hero-desc" class="text-lg text-slate-400 max-w-2xl mx-auto mb-10 opacity-0"></p>
      <div id="hero-cta" class="flex flex-col sm:flex-row items-center justify-center gap-4 opacity-0">
        <a href="#about" class="magnetic-btn group relative inline-flex items-center gap-2 px-8 py-3.5 bg-cyan-500 text-surface-950 font-semibold rounded-full overflow-hidden">
          <span class="relative z-10">About Me</span>
          <svg class="relative z-10 w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
          <div class="absolute inset-0 bg-cyan-400 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
        </a>
        <a href="#projects" class="magnetic-btn inline-flex items-center gap-2 px-8 py-3.5 border border-slate-700 text-slate-300 font-medium rounded-full hover:border-cyan-500/50 hover:text-cyan-400 transition-all">
          Projects
        </a>
      </div>
      <div id="scroll-indicator" class="absolute bottom-10 left-1/2 -translate-x-1/2 opacity-0">
        <div class="flex flex-col items-center gap-2 text-slate-500">
          <span class="text-xs font-mono tracking-widest uppercase">Scroll</span>
          <div class="w-5 h-8 border-2 border-slate-600 rounded-full flex justify-center pt-1.5">
            <div class="w-1 h-2 bg-cyan-400 rounded-full animate-bounce"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about" class="relative py-32 overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-500/20 to-transparent"></div>
    <div class="max-w-6xl mx-auto px-6">
      <div class="flex items-center gap-4 mb-16 about-reveal">
        <span class="text-cyan-400 font-mono text-sm">01</span>
        <h2 class="text-3xl md:text-4xl font-bold text-white">About Me</h2>
        <div class="flex-1 h-px bg-gradient-to-r from-slate-700 to-transparent"></div>
      </div>
      <div class="grid md:grid-cols-5 gap-12 items-start">
        <div id="about-card" class="md:col-span-2 about-reveal"></div>
        <div id="about-bio" class="md:col-span-3 about-reveal"></div>
      </div>
    </div>
  </section>

  <!-- EXPERIENCE -->
  <section id="experience" class="relative py-32">
    <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-500/20 to-transparent"></div>
    <div class="max-w-6xl mx-auto px-6">
      <div class="flex items-center gap-4 mb-20 exp-reveal">
        <span class="text-cyan-400 font-mono text-sm">02</span>
        <h2 class="text-3xl md:text-4xl font-bold text-white">Experience</h2>
        <div class="flex-1 h-px bg-gradient-to-r from-slate-700 to-transparent"></div>
      </div>
      <div id="experience-timeline" class="relative">
        <!-- Track (grey background line) -->
        <div class="timeline-track"></div>
        <!-- Progress (cyan fill, animated via GSAP) -->
        <div class="timeline-progress" id="timeline-progress"></div>
        <!-- Items rendered by JS -->
      </div>
    </div>
  </section>

  <!-- SKILLS -->
  <section id="skills" class="relative py-32 overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-500/20 to-transparent"></div>
    <div class="max-w-6xl mx-auto px-6">
      <div class="flex items-center gap-4 mb-16 skills-reveal">
        <span class="text-cyan-400 font-mono text-sm">03</span>
        <h2 class="text-3xl md:text-4xl font-bold text-white">Technical Skills</h2>
        <div class="flex-1 h-px bg-gradient-to-r from-slate-700 to-transparent"></div>
      </div>
      <div id="skills-grid" class="grid md:grid-cols-2 gap-8 items-start"></div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects" class="relative py-32 overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-500/20 to-transparent"></div>
    <div class="max-w-6xl mx-auto px-6">
      <div class="flex items-center gap-4 mb-16 projects-reveal">
        <span class="text-cyan-400 font-mono text-sm">04</span>
        <h2 class="text-3xl md:text-4xl font-bold text-white">Featured Projects</h2>
        <div class="flex-1 h-px bg-gradient-to-r from-slate-700 to-transparent"></div>
      </div>
      <div class="flex gap-3 mb-10 projects-reveal" id="project-filters">
        <button class="project-filter-btn active px-5 py-2 rounded-full text-sm font-medium transition-all" data-filter="all">All</button>
        <button class="project-filter-btn px-5 py-2 rounded-full text-sm font-medium transition-all" data-filter="client">Client</button>
        <button class="project-filter-btn px-5 py-2 rounded-full text-sm font-medium transition-all" data-filter="personal">Personal</button>
      </div>
      <div id="projects-grid" class="grid md:grid-cols-2 gap-8"></div>
    </div>
  </section>

  <!-- GITHUB CONTRIBUTIONS -->
  <section id="github" class="relative py-32 overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-500/20 to-transparent"></div>
    <div class="max-w-6xl mx-auto px-6">
      <div class="flex items-center gap-4 mb-16 gh-reveal">
        <span class="text-cyan-400 font-mono text-sm">05</span>
        <h2 class="text-3xl md:text-4xl font-bold text-white">Open Source Contributions</h2>
        <div class="flex-1 h-px bg-gradient-to-r from-slate-700 to-transparent"></div>
      </div>
      <div id="github-grid" class="grid md:grid-cols-2 gap-8"></div>
    </div>
  </section>

  <!-- GALLERY -->
  <section id="gallery" class="relative py-32 overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-500/20 to-transparent"></div>
    <div class="max-w-6xl mx-auto px-6">
      <div class="flex items-center gap-4 mb-16 gallery-reveal">
        <span class="text-cyan-400 font-mono text-sm">06</span>
        <h2 class="text-3xl md:text-4xl font-bold text-white">Gallery</h2>
        <div class="flex-1 h-px bg-gradient-to-r from-slate-700 to-transparent"></div>
      </div>
      <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 auto-rows-[300px]"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="relative py-32 overflow-hidden">
    <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-500/20 to-transparent"></div>
    <div class="max-w-4xl mx-auto px-6 text-center">
      <div class="flex items-center justify-center gap-4 mb-8 contact-reveal">
        <span class="text-cyan-400 font-mono text-sm">07</span>
        <h2 class="text-3xl md:text-4xl font-bold text-white">Get in Touch</h2>
      </div>
      <p class="text-lg text-slate-400 mb-12 max-w-xl mx-auto contact-reveal">
        Interested in working together? Let's connect and discuss your next project.
      </p>
      <div id="contact-grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-12"></div>
      <div id="contact-cta" class="flex flex-col md:flex-row md:items-center md:justify-center contact-reveal gap-4"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="border-t border-slate-800/50 py-8">
    <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <p id="footer-copy" class="text-slate-500 text-sm font-mono"></p>
      <p class="text-slate-600 text-xs">Built with GSAP + TailwindCSS</p>
    </div>
  </footer>
  <script src="static/script.js"></script>
</body>
</html>
